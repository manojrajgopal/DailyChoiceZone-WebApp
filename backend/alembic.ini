# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent: the URL is built from the
# environment in alembic/env.py, so there is exactly one place credentials
# come from and none of them are committed.

[alembic]
script_location = alembic
prepend_sys_path = .

# Migration filenames lead with a timestamp so `ls` shows them in the order
# they were written, which a bare revision hash does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
