[pytest]
# `app` is importable from the backend root without anyone exporting PYTHONPATH.
pythonpath = .

testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

markers =
    integration: exercises the API and the database together

# The suite has no async fixtures; pinning the scope silences a deprecation
# warning about a default that is changing in a later pytest-asyncio.
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning:starlette.*
